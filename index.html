<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
  <title>Форма запиту</title>
  <style>
   body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  margin: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #4c74af8c;
}

/* Базові стилі */
label {
  display: block;
  margin-top: 10px;
  width: 300px;
}
input, select, textarea {
  width: 150%;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.7);
  box-sizing: border-box;
}
button {
  margin-top: 15px;
  padding: 10px 20px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background-color: #4c74af;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.7);
}

/* Toast */
#toast {
  visibility: hidden;
  min-width: 250px;
  margin-left: -125px;
  background-color: #4c74af;
  color: #fff;
  text-align: center;
  border-radius: 10px;
  padding: 12px;
  position: fixed;
  z-index: 1;
  left: 50%;
  bottom: 130px;
  font-size: 16px;
}
#toast.show {
  visibility: visible;
  animation: fadein 0.5s, fadeout 0.5s 2.5s;
}
@keyframes fadein {
  from {bottom: 0; opacity: 0;}
  to {bottom: 130px; opacity: 1;}
}
@keyframes fadeout {
  from {bottom: 130px; opacity: 1;}
  to {bottom: 0; opacity: 0;}
}

/* 📱 Мобільні телефони */
@media (max-width: 480px) {
  label { width: 100%; }
  input, select, textarea { width: 100%; font-size: 14px; }
  button { width: 100%; font-size: 14px; }
  #toast { font-size: 14px; bottom: 80px; }
}

/* 📲 Планшети */
@media (min-width: 481px) and (max-width: 768px) {
  label { width: 90%; }
  input, select, textarea { width: 100%; font-size: 15px; }
  button { width: 80%; font-size: 15px; }
  #toast { font-size: 15px; bottom: 100px; }
}

/* 💻 Десктопи */
@media (min-width: 769px) {
  label { width: 300px; }
  input, select, textarea { width: 150%; font-size: 16px; }
  button { width: auto; font-size: 16px; }
}

  </style>
</head>
<body>
  <h1>Залиште запит</h1>
  <form id="requestForm">
    <label>Ім’я (обов’язково):
      <input type="text" id="name" required>
    </label>
    <label>Телефон (обов’язково):
  <input type="tel" id="phone" required autocomplete="tel" inputmode="numeric">
</label>
    <label>Email:
      <input type="email" id="email">
    </label>
    <label>Клініка (обов’язково):
  <select id="clinic" required>
  <option value="">Оберіть клініку</option>
  <option value="СІТІ Доктор">
    СІТІ Доктор (м. Київ, просп. С. Бандери, 17/1)
  </option>
  <option value="Ортопедія, травматологія та реабілітація лікаря Олександра Юрчишина">
    Ортопедія та реабілітація (м. Буча, вул. Амосова 4, прим. 17)
  </option>
  <option value="Меділюкс Вінниця">
    Меділюкс (м. Вінниця, вул. Литвиненко-Вольгемут, 5)
  </option>
  <option value="Меділюкс Хмільник">
    Меділюкс (м. Хмільник, вул. Шевченка, 28А)
  </option>
  <option value="SPINEX">
    SPINEX (м. Вінниця, вул. Князів Коріатовичів, 209-А)
  </option>
  <option value="Приватний кабінет Ростислав Чаплинський">
    Кабінет Ростислава Чаплинського (м. Самбір, вул. Січових Стрільців 25)
  </option>
</select>
</label>

    <label>Ваш запит:
      <textarea id="message" rows="5"></textarea>
    </label>
    <button type="submit">Надіслати</button>
  </form>
<button onclick="window.location.href='analitics.html'">
  Перейти до аналітики
</button>
<div id="toast">✅ Запит успішно надіслано!</div>
<script src="inputmask.min.js"></script>
<script>
  const phoneInput = document.getElementById("phone");
  Inputmask({
    mask: "+38 (099)999-99-99",
    placeholder: "_",
    showMaskOnHover: false,
    showMaskOnFocus: true,
    clearIncomplete: true,
    autoUnmask: false
  }).mask(phoneInput);
</script>

<script>
 function showToast() {
    const toast = document.getElementById("toast");
    toast.className = "show";
    setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
  }


    document.getElementById("requestForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const data = {
    name: document.getElementById("name").value,
    phone: phoneInput.inputmask.unmaskedvalue(), // чистий номер
    email: document.getElementById("email").value,
    clinic: document.getElementById("clinic").value, // тепер клініка
    message: document.getElementById("message").value
  };

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbxqKzAUX9CAH26-cBOuTVZ49stlllNHbVvF3OkXrGoi8xGHPDBMJRp_Ooi7JrphjTnA/exec", {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data),
      headers: { "Content-Type": "application/json" }
    });
    showToast(); // замість alert
  } catch (err) {
    alert("Помилка надсилання!");
    console.error(err);
  }
});

  </script>
</body>
</html>
