<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
  <title>Форма запиту</title>
  <style>
   body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  margin: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #4c74af8c;
}

/* Базові стилі */
label {
  display: block;
  margin-top: 10px;
  width: 300px;
}
input, select, textarea {
  width: 150%;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.7);
  box-sizing: border-box;
}
button {
  margin-top: 15px;
  padding: 10px 20px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background-color: #4c74af;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.7);
}
button:hover {
  background-color: #3b5a8a;
  box-shadow: 0 2px 5px rgba(119, 81, 255, 0.7);
}
button:active {
  background-color: #2a3e5c;
  box-shadow: 0 6px 9px rgba(119, 81, 255, 0.7);
}
/* Toast */
#toast {
  visibility: hidden;
  min-width: 250px;
  margin-left: -125px;
  background-color: #4c74af;
  color: #fff;
  text-align: center;
  border-radius: 10px;
  padding: 12px;
  position: fixed;
  z-index: 1;
  left: 50%;
  bottom: 130px;
  font-size: 16px;
}
#toast.show {
  visibility: visible;
  animation: fadein 0.5s, fadeout 0.5s 2.5s;
}
@keyframes fadein {
  from {bottom: 0; opacity: 0;}
  to {bottom: 130px; opacity: 1;}
}
@keyframes fadeout {
  from {bottom: 130px; opacity: 1;}
  to {bottom: 0; opacity: 0;}
}

/* 📱 Мобільні телефони */
@media (max-width: 480px) {
  label { width: 100%; }
  input, select, textarea { width: 100%; font-size: 14px; }
  button { width: 100%; font-size: 14px; }
  #toast { font-size: 14px; bottom: 80px; }
}

/* 📲 Планшети */
@media (min-width: 481px) and (max-width: 768px) {
  label { width: 90%; }
  input, select, textarea { width: 100%; font-size: 15px; }
  button { width: 80%; font-size: 15px; }
  #toast { font-size: 15px; bottom: 100px; }
}

/* 💻 Десктопи */
@media (min-width: 769px) {
  label { width: 300px; }
  input, select, textarea { width: 150%; font-size: 16px; }
  button { width: auto; font-size: 16px; }
}

  </style>
</head>
<body>
  <h1>Залиште запит</h1>
  <form id="requestForm">
    <label>Ім’я (обов’язково):
      <input type="text" id="name" required>
    </label>
    <label>Телефон (обов’язково):
  <input type="tel" id="phone" required placeholder="+38 (___) ___-__-__">
    <label>Email:
      <input type="email" id="email">
    </label>
    <label>Клініка (обов’язково):
  <select id="clinic" required>
  <option value="">Оберіть клініку</option>
  <option value="СІТІ Доктор">
    СІТІ Доктор (м. Київ, просп. С. Бандери, 17/1)
  </option>
  <option value="Олександр Юрчишин ортопедія, травматологія та реабілітація">
    Ортопедія та реабілітація (м. Буча, вул. Амосова 4, прим. 17)
  </option>
  <option value="Меділюкс Вінниця">
    Меділюкс (м. Вінниця, вул. Литвиненко-Вольгемут, 5)
  </option>
  <option value="Меділюкс Хмільник">
    Меділюкс (м. Хмільник, вул. Шевченка, 28А)
  </option>
  <option value="SPINEX Вінниця">
    SPINEX (м. Вінниця, вул. Князів Коріатовичів, 209-А)
  </option>
  <option value="Ростислав Чаплинський приватний кабінет">
    Кабінет Ростислава Чаплинського (м. Самбір, вул. Січових Стрільців 25)
  </option>
</select>
</label>

    <label>Ваш запит:
      <textarea id="message" rows="5"></textarea>
    </label>
    <button type="submit">Надіслати</button>
  </form>
<button onclick="window.location.href='analitics.html'">
  Перейти до аналітики
</button>
<div id="toast">✅ Запит успішно надіслано!</div>
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-1030963598"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-1030963598');
</script>
<script src="https://unpkg.com/imask"></script>
<script>
  // Ініціалізація маски телефону
  const phoneMask = IMask(
    document.getElementById('phone'), {
      mask: '+{38} (000) 000-00-00'
    }
  );

  // Сніпет конверсії Google Ads (додаємо саму функцію)
  function gtag_report_conversion(url) {
    var callback = function () {
      if (typeof(url) != 'undefined' && url !== '') {
        window.location = url;
      }
    };
    // Перевіряємо, чи взагалі ініціалізований gtag на сторінці, щоб не було помилок в консолі
    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {
          'send_to': 'AW-1030963598/DdH2CPD1w70cEI6DzesD',
          'value': 1.0,
          'currency': 'UAH',
          'event_callback': callback
      });
    } else {
      console.warn("gtag не знайдено. Перевірте, чи підключений основний код Google Tag на сторінці.");
      callback();
    }
    return false;
  }

  // Показ повідомлення
  function showToast() {
    const toast = document.getElementById("toast");
    toast.className = "show";
    setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
  }

  // Обробка форми
  document.getElementById("requestForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    // Витягуємо дані (виправлено phoneMask)
    const data = {
      name: document.getElementById("name").value,
      phone: phoneMask.unmaskedValue, // Тепер без помилок
      email: document.getElementById("email").value,
      clinic: document.getElementById("clinic").value,
      message: document.getElementById("message").value
    };

    // ✅ Показуємо toast та шлемо конверсію в Google Ads
    showToast();
    gtag_report_conversion(''); // Передаємо порожній рядок, щоб не було редіректу

    try {
      await fetch("https://script.google.com/macros/s/AKfycbwhsVdWLWZ0BKCCeKllbQaWy_LEMxPpX-Rj3n9xu8vBbaDc-HZ8abhAFBpuiGmIs_l-/exec", {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" }
      });

      // ✅ Очищуємо форму
      document.getElementById("requestForm").reset();
    } catch (err) {
      alert("Помилка надсилання на бекенд!");
      console.error(err);
    }
  });
</script>
</body>
</html>
