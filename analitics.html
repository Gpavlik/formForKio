<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналітика лідів</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
     body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  margin: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #4c74af8c;
  justify-content: space-evenly;
}
    h2 { color: #4c74af; }
    #filters { margin-bottom: 20px; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    input, select, textarea {
  width: 150px;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.7);
  box-sizing: border-box;
}
    .chart { margin-top: 20px; }
    button {
  margin-top: 15px;
  padding: 10px 20px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background-color: #4c74af;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.7);
}
/* 📱 Мобільні телефони */
@media (max-width: 480px) {
  label { width: 100%; }
  input, select, textarea { width: 100%; font-size: 14px; }
  button { width: 100%; font-size: 14px; }
  #toast { font-size: 14px; bottom: 80px; }
}

/* 📲 Планшети */
@media (min-width: 481px) and (max-width: 768px) {
  label { width: 90%; }
  input, select, textarea { width: 100%; font-size: 15px; }
  button { width: 80%; font-size: 15px; }
  #toast { font-size: 15px; bottom: 100px; }
}

/* 💻 Десктопи */
@media (min-width: 769px) {
  label { width: 300px; }
  input, select, textarea { width: 150px; font-size: 16px; }
  button { width: auto; font-size: 16px; }
}

  </style>
</head>
<body>
  <h2>Аналітика лідів</h2>
  <div id="filters">
    <label>Клініка:
      <select id="clinicFilter">
        <option value="">Всі</option>
        <option value="СІТІ Доктор">СІТІ Доктор</option>
        <option value="Ортопедія, травматологія та реабілітація лікаря Олександра Юрчишина">Ортопедія (Буча)</option>
        <option value="Меділюкс Вінниця">Меділюкс Вінниця</option>
        <option value="Меділюкс Хмільник">Меділюкс Хмільник</option>
        <option value="SPINEX">SPINEX</option>
        <option value="Приватний кабінет Ростислав Чаплинський">Кабінет Чаплинський</option>
      </select>
    </label>
    <label>Від:
      <input type="date" id="dateFrom">
    </label>
    <label>До:
      <input type="date" id="dateTo">
    </label>
<label>Статус:
  <select id="statusFilter">
    <option value="">Всі</option>
    <option value="переглянуто">Переглянуто</option>
    <option value="не переглянуто">Не переглянуто</option>
  </select>
</label>

    <button onclick="applyFilters()">Фільтрувати</button>
  </div>

  <div id="statusChart" class="chart"></div>
  <div id="clinicChart" class="chart"></div>
  <div id="tableChart" class="chart"></div>
  <div id="dateChart" class="chart"></div>
  <div id="avgResponse" class="chart"></div>
  <div id="responseChart" class="chart"></div>

  <script>
    google.charts.load('current', {'packages':['corechart','table']});
    google.charts.setOnLoadCallback(loadData);

    let allRows = [];

    async function loadData() {
      const response = await fetch("https://script.google.com/macros/s/AKfycbxqKzAUX9CAH26-cBOuTVZ49stlllNHbVvF3OkXrGoi8xGHPDBMJRp_Ooi7JrphjTnA/exec");
      allRows = await response.json();
      applyFilters();
    }

    function applyFilters() {
  const clinic = document.getElementById("clinicFilter").value;
  const status = document.getElementById("statusFilter").value;
  const dateFrom = document.getElementById("dateFrom").value ? new Date(document.getElementById("dateFrom").value) : null;
  const dateTo = document.getElementById("dateTo").value ? new Date(document.getElementById("dateTo").value) : null;

  const filtered = allRows.filter(r => {
    const clinicMatch = !clinic || r["Клініка"] === clinic;
    const statusMatch = !status || r["Статус"] === status;
    const date = new Date(r["Дата"]);
    const dateMatch = (!dateFrom || date >= dateFrom) && (!dateTo || date <= dateTo);
    return clinicMatch && statusMatch && dateMatch;
  });

      const dataArray = [["Ім’я","Клініка","Статус","Коментар"]];
filtered.forEach(r => {
  dataArray.push([
    r["Ім'я"],
    r["Клініка"],
    r["Чи переглянуто"],
    r["Коментар"] || ""
  ]);
});

      drawCharts(dataArray);
    }

function drawCharts(dataArray) {
  // Таблиця
  const tableData = google.visualization.arrayToDataTable(dataArray);
  const table = new google.visualization.Table(document.getElementById('tableChart'));
  table.draw(tableData);

  // 📊 Статуси
  const statusCounts = {};
  dataArray.slice(1).forEach(row => {
    statusCounts[row[2]] = (statusCounts[row[2]] || 0) + 1;
  });
  const statusData = google.visualization.arrayToDataTable([
    ["Статус", "Кількість"],
    ...Object.entries(statusCounts)
  ]);
  const statusChart = new google.visualization.PieChart(document.getElementById('statusChart'));
  statusChart.draw(statusData, { title: "Розподіл по статусах" });

  // 📊 Клініки
  const clinicCounts = {};
  dataArray.slice(1).forEach(row => {
    clinicCounts[row[1]] = (clinicCounts[row[1]] || 0) + 1;
  });
  const clinicData = google.visualization.arrayToDataTable([
    ["Клініка", "Кількість"],
    ...Object.entries(clinicCounts)
  ]);
  const clinicChart = new google.visualization.ColumnChart(document.getElementById('clinicChart'));
  clinicChart.draw(clinicData, { title: "Ліди по клініках" });

  // 📈 Динаміка по датах
  const dateCounts = {};
  dataArray.slice(1).forEach(row => {
    const dateObj = new Date(row[4]); // колонка "Дата"
    const dateKey = dateObj.toDateString();
    dateCounts[dateKey] = (dateCounts[dateKey] || 0) + 1;
  });

  const dateData = new google.visualization.DataTable();
  dateData.addColumn('date', 'Дата');
  dateData.addColumn('number', 'Кількість');
  Object.entries(dateCounts).forEach(([key, value]) => {
    dateData.addRow([new Date(key), value]);
  });

  const dateChart = new google.visualization.LineChart(document.getElementById('dateChart'));
  dateChart.draw(dateData, { title: "Динаміка лідів по днях" });

  // 📊 Середній час відповіді
  let totalMinutes = 0;
  let count = 0;
  dataArray.slice(1).forEach(row => {
    const created = new Date(row[4]);
    const comment = row[3];
    if (comment && created) {
      const now = new Date();
      const diffMs = now - created;
      const diffMinutes = Math.round(diffMs / 60000);
      totalMinutes += diffMinutes;
      count++;
    }
  });

  if (count > 0) {
    const avgMinutes = Math.round(totalMinutes / count);
    const avgHours = (avgMinutes / 60).toFixed(1);
    document.getElementById("avgResponse").innerHTML =
      `<h3>Середній час відповіді: ${avgMinutes} хв (~${avgHours} год)</h3>`;
  } else {
    document.getElementById("avgResponse").innerHTML =
      `<h3>Середній час відповіді: немає даних</h3>`;
  }

  // 📊 Розподіл часу відповіді по клініках
  const responseTimes = {};
  dataArray.slice(1).forEach(row => {
    const created = new Date(row[4]);
    const clinic = row[1];
    const comment = row[3];
    if (comment && created) {
      const now = new Date();
      const diffMinutes = Math.round((now - created) / 60000);
      if (!responseTimes[clinic]) responseTimes[clinic] = [];
      responseTimes[clinic].push(diffMinutes);
    }
  });

  const responseDataArray = [["Клініка", "Час відповіді (хв)"]];
  Object.entries(responseTimes).forEach(([clinic, times]) => {
    times.forEach(t => responseDataArray.push([clinic, Number(t)]));
  });

  if (responseDataArray.length > 1) {
    const responseData = google.visualization.arrayToDataTable(responseDataArray);
    const responseChart = new google.visualization.Histogram(document.getElementById('responseChart'));
    responseChart.draw(responseData, {
      title: "Розподіл часу відповіді по клініках",
      legend: { position: "none" },
      histogram: { bucketSize: 60 },
      hAxis: { title: "Час відповіді (хв)" },
      vAxis: { title: "Кількість лідів" }
    });
  } else {
    document.getElementById("responseChart").innerHTML =
      "<h3>Немає даних для розрахунку часу відповіді</h3>";
  }


// 📊 BoxPlot часу відповіді по клініках
const boxDataArray = [["Клініка","Min","Q1","Median","Q3","Max"]];
Object.entries(responseTimes).forEach(([clinic, times]) => {
  times.sort((a,b)=>a-b);
  const min = times[0];
  const max = times[times.length-1];
  const median = times[Math.floor(times.length/2)];
  const q1 = times[Math.floor(times.length/4)];
  const q3 = times[Math.floor(3*times.length/4)];
  boxDataArray.push([clinic, min, q1, median, q3, max]);
});

if (boxDataArray.length > 1) {
  const boxData = google.visualization.arrayToDataTable(boxDataArray);
  const boxChart = new google.visualization.CandlestickChart(document.getElementById('responseChart'));
  boxChart.draw(boxData, {
    title: "BoxPlot часу відповіді по клініках",
    legend: "none"
  });
}}
  </script>
</body>
</html>
